[package]
name = "database"
version = "0.1.0"
edition = "2021"
description = "SQLite persistence layer using rusqlite for disk scanner"

[lib]
name = "database"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"