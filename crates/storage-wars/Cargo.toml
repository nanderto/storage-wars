[package]
name = "storage-wars"
version = "0.1.0"
edition = "2021"
description = "Storage Wars — a desktop application built with GPUI"
authors = []
license = "MIT"

[[bin]]
name = "storage-wars"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", tag = "v0.168.2" }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

[build-dependencies]

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true