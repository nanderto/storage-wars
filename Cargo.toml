[package]
name = "database"
version = "0.1.0"
edition = "2021"
description = "SQLite persistence layer for disk scanner using rusqlite"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3"