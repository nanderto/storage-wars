[package]
name = "storage-wars"
version = "0.1.0"
edition.workspace = true
description = "Storage Wars desktop application — auction unit storage management"
license.workspace = true

[[bin]]
name = "storage-wars"
path = "src/main.rs"

[dependencies]
# GPUI is sourced from the Zed monorepo.
# Pin to a specific commit for reproducible builds.
gpui = { git = "https://github.com/zed-industries/zed", rev = "0.169.2" }
log = "0.4"
env_logger = "0.11"