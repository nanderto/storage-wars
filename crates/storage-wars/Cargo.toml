[package]
name = "storage-wars"
version = "0.1.0"
edition = "2021"
description = "Storage Wars desktop application — manage and explore your storage units"
authors     = []
license     = "MIT"

[[bin]]
name = "storage-wars"
path = "src/main.rs"

[dependencies]
# GPUI — pulled directly from the Zed monorepo.
# Pin to a specific commit for reproducible builds; update deliberately.
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }

anyhow     = "1.0"
log        = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 0
debug     = true

[profile.release]
opt-level      = 3
lto            = true
codegen-units  = 1
strip          = true