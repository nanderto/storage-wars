[package]
name = "scanner"
version = "0.1.0"
edition = "2021"
description = "Multi-threaded filesystem scanner with incremental and synchronous scanning modes"
authors = []

[[bin]]
name = "scanner"
path = "src/main.rs"

[lib]
name = "scanner"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true