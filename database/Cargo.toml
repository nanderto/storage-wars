[package]
name = "database"
version = "0.1.0"
edition = "2021"
description = "SQLite persistence layer using rusqlite for disk scanner"

[lib]
name = "database"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true