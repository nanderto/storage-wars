[package]
name = "models"
version = "0.1.0"
edition = "2021"
description = "Core data model types for the disk usage analyzer desktop application"
authors = []
license = "MIT"

[lib]
name = "models"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
incremental = true