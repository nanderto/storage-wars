[package]
name = "views"
version = "0.1.0"
edition = "2021"
description = "GPUI view components for disk space analyzer"
authors = []
publish = false

[[bin]]
name = "views"
path = "src/main.rs"

[lib]
name = "views"
path = "src/lib.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", tag = "v0.163.2" }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
bytesize = "1.3"
uuid = { version = "1.8", features = ["v4", "serde"] }

[dev-dependencies]
pretty_assertions = "1.4"

[features]
default = []

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
# Optimise dependencies even in dev builds for faster UI rendering.
opt-level = 2