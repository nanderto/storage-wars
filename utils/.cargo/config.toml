[build]
# Ensure deterministic builds across platforms.
# Uncomment the target line if cross-compiling is needed.
# target = "x86_64-pc-windows-msvc"

[profile.dev]
# Faster incremental builds during development.
opt-level = 0
debug = true

[profile.test]
# Keep debug info for better test diagnostics.
opt-level = 0
debug = true