[package]
name = "storage-wars"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Storage Wars — desktop application for managing storage units"
publish = false

[[bin]]
name = "storage-wars"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", rev = "0f5b37f" }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"