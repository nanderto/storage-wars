[package]
name = "views"
version = "0.1.0"
edition = "2021"
description = "GPUI view components for disk space analyzer"
build = "build.rs"

[lib]
name = "views"
path = "src/lib.rs"

[[bin]]
name = "views"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "main" }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
# No additional dev deps needed for scaffold

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"