[package]
name = "views"
version = "0.1.0"
edition = "2021"
description = "GPUI view components for disk space analyzer"
authors = []

[[bin]]
name = "views"
path = "src/main.rs"

[lib]
name = "views"
path = "src/lib.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "main" }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true