[package]
name = "storage-wars"
version = "0.1.0"
edition = "2021"
description = "Storage Wars desktop application — manage and explore your storage units"
authors = []
license = "MIT"
rust-version = "1.80"

[[bin]]
name = "storage-wars"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]